# Experimental split delivery: native FeishuAdapter only, NOT relay.
# This intentionally produces a progress card plus a separate final message.
# Merge after the base separate-message mode has passed canary validation.
# Requires message-send/read permissions and a private, persistent HERMES_HOME.
hermes_lark_streaming:
  final_delivery: separate_message
  progress_card: compact
  streaming_card_start: first_answer
  verified_delivery: true
gateway:
  delivery_ledger: false       # exactly one recovery sender, not two
