# Merge into a TEST Profile's config.yaml; never replace its whole config.
# Normal success publishes one CardKit message. Plain text is failure fallback.
hermes_lark_streaming:
  enabled: true
  final_delivery: card
  streaming_card_start: first_answer  # compression stays outside the main card
  verified_delivery: false            # verified delivery is separate-message only
  card_completion_timeout_sec: 10
  answer_flush_interval_ms: 800
  flush_interval_ms: 1000
  print_strategy: fast
  streaming_panel_expanded: false
  panel_expanded: false
  max_tool_steps: 8
  max_reasoning_rounds: 3
  queue:
    serialized_chat_ids: []
    verify_waiting_message_available: true
display:
  platforms:
    feishu:
      show_reasoning: false
